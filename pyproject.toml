[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.14"

[tool.mypy]
files = [ "." ]
exclude = [ "build" ]
exclude_gitignore = true
follow_untyped_imports = true
strict = true
plugins = [
    "mypy_pytest_parametrize",
    "mypy_strict_kwargs",
]
num_workers = "auto"

[tool.pyrefly]
search_path = [ "." ]
errors.non-exhaustive-match = "error"
enabled-ignores = [ "pyrefly" ]
preset = "all"

[tool.pyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = true

[tool.ty]
rules.all = "error"
terminal.error-on-warning = true
analysis.respect-type-ignore-comments = false
analysis.strict-equality-semantics = true
analysis.strict-generic-narrowing = true

[tool.pytest]
asyncio_mode = "strict"
beartype_packages = [ "coderpad" ]
beartype_test_fixtures = true
beartype_tests = true
log_cli = true
xfail_strict = true

[tool.coverage]
run.source = [ "src/", "tests/" ]
run.branch = true
report.fail_under = 100
report.exclude_also = [
    "if TYPE_CHECKING:",
]
report.show_missing = true

[tool.towncrier]
# Write the same native Markdown file used by documentation and GitHub releases.
directory = "newsfragments"
filename = "docs/source/changelog/{version}.md"
title_format = "# {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/adamtheturtle/coderpad/issues/{issue})"
single_file = false
# Reject invalid fragment names instead of silently losing release entries.
ignore = [ ".gitkeep" ]
type = [ { directory = "change", name = "Changes", showcontent = true } ]

[tool.pydocstringformatter]
write = true
split-summary-body = false
# Use a lower line length than ruff (79) to avoid conflicts with D200 -
# pydocstringformatter would otherwise split docstrings at exactly 79 chars
# which ruff considers should stay on one line.
max-line-length = 75
linewrap-full-docstring = true

[tool.doc8]
max_line_length = 2000
ignore_path = [
    "./.eggs",
    "./docs/build",
    "./docs/build/spelling/output.txt",
    "./node_modules",
    "./src/*.egg-info/",
    "./src/*/_setuptools_scm_version.txt",
]

[tool.yamlfix]
section_whitelines = 1
whitelines = 1

[tool.no_defaults]
private_only = true
per_file_enforcement."tests/**" = "all"

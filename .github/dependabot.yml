---
version: 2

updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily

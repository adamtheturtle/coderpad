---
name: API drift report
description: Report a mismatch between live CoderPad API responses and this client
title: '[API drift]: '
labels: [api-drift]

body:
  - type: markdown
    attributes:
      value: |
        Use this template when the live CoderPad API behaves differently from the
        published specification or from what ``coderpad-py`` currently models.

        See ``docs/source/openapi-spec.rst`` for background on empirically observed
        fields and spec corrections.
  - type: dropdown
    id: api
    attributes:
      label: API
      description: Which CoderPad API surface is affected?
      options: [Interview API, Screen API, Both, Unsure]
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      description: HTTP method and path, for example ``GET /api/pads``.
      placeholder: GET /api/pads
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What the published spec or client currently assumes.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What the live API returns or accepts instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample request or response
      description: Redact tokens, emails, and other account-specific data.
      render: shell
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: coderpad-py version
      description: PyPI release or git commit where you observed the drift.
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested client change
      description: Optional notes on model, typing, or documentation updates.
    validations:
      required: false
